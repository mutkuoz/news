<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{{PAGE_TITLE}}</title>
	<meta name="description" content="{{META_DESC}}" />
	<link rel="canonical" href="{{CANONICAL}}" />
	<meta name="author" content="Mehmet Utku Öztürk" />
	<meta name="robots" content="noindex, nofollow" />
	<meta name="theme-color" content="#f6f3ea" />
	<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
	<link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
	<meta property="og:type" content="article" />
	<meta property="og:site_name" content="The Utku Times" />
	<meta property="og:title" content="{{PAGE_TITLE}}" />
	<meta property="og:description" content="{{META_DESC}}" />

	<link rel="preload" href="/assets/fonts/unifrakturcook-bold-latin.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="preload" href="/assets/fonts/newsreader-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="stylesheet" href="/assets/fonts.css" />

<style>
@font-face {
	font-family: 'UnifrakturCook'; font-style: normal; font-weight: 700; font-display: swap;
	src: url(/assets/fonts/unifrakturcook-bold-latin.woff2) format('woff2');
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
	--paper: #fbfaf6; --desk: #e4e0d4; --ink: #121212; --ink2: #333; --muted: #6b6860; --rule: #121212; --hair: rgba(18,18,18,.22);
	--serif: 'Newsreader', Georgia, 'Times New Roman', serif;
	--display: 'Playfair Display', Georgia, 'Times New Roman', serif;
	--black: 'UnifrakturCook', 'Playfair Display', Georgia, serif;
}
html { background: var(--desk); }
body { font-family: var(--serif); color: var(--ink); line-height: 1.42; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
::selection { background: var(--ink); color: var(--paper); }

/* ── toolbar (screen only) ─────────────────────────────────────────── */
.bar { position: sticky; top: 0; z-index: 50; display: flex; gap: 1.2rem; align-items: center; justify-content: space-between;
	padding: .55rem 1.2rem; background: rgba(228,224,212,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--hair);
	font-size: .86rem; }
.bar a, .bar button { color: var(--ink); text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; }
.bar a:hover, .bar button:hover { text-decoration: underline; text-underline-offset: 3px; }
.bar .brand { font-family: var(--display); font-style: italic; font-weight: 600; }
.bar nav { display: flex; gap: 1.2rem; }

/* ── the sheets ────────────────────────────────────────────────────── */
.wrap { padding: 1.6rem 1rem 3rem; }
.sheet { position: relative; background: var(--paper); max-width: 62rem; margin: 0 auto 2.2rem; padding: 1.5rem 1.6rem 1rem;
	box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 10px 40px rgba(0,0,0,.18); }

.flag { text-align: center; }
.tagline { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.nameplate { font-family: var(--black); font-weight: 700; font-size: clamp(2.8rem, 10.5vw, 5.8rem); line-height: 1.02; margin: .15rem 0 .35rem; letter-spacing: .005em; }
.folio-bar { display: flex; justify-content: space-between; gap: .6rem; padding: .3rem 0; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule);
	font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; }

.cols { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(0, 1fr); margin-top: .6rem; }
.main { padding-right: 1.1rem; border-right: 1px solid var(--rule); }
.side { padding-left: 1.1rem; }
@media screen and (max-width: 760px) { .cols { grid-template-columns: 1fr; } .main { padding-right: 0; border-right: 0; } .side { padding-left: 0; margin-top: 1.2rem; border-top: 1px solid var(--rule); padding-top: .8rem; } }

.kicker { font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
.lead-h { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 5.2vw, 2.9rem); line-height: 1.04; letter-spacing: -.01em; margin: .15rem 0 .3rem; }
.deck { font-style: italic; font-size: 1.02rem; color: var(--ink2); margin-bottom: .6rem; }

/* halftone: grayscale photo, crushed contrast, dot screen on top */
.photo { margin: .3rem 0 .45rem; }
.halftone { position: relative; aspect-ratio: 16 / 7; overflow: hidden; background: #111; }
.halftone img, .halftone svg { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.35) brightness(.95); }
.halftone svg { filter: none; }
.halftone::after { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
	background-image: radial-gradient(circle at center, #000 0 .8px, transparent 1.25px); background-size: 3.4px 3.4px; opacity: .38; }
.photo figcaption { font-size: .68rem; color: var(--muted); margin-top: .25rem; line-height: 1.3; }
.photo .credit { font-style: italic; }

.lead-body { column-count: 2; column-gap: 1.1rem; column-rule: 1px solid var(--hair); text-align: justify; hyphens: auto; font-size: .92rem; line-height: 1.38; }
.lead-body p { margin-bottom: .5rem; text-indent: 1em; }
.lead-body p:first-child { text-indent: 0; }
.lead-body p:first-child::first-letter { font-family: var(--display); font-weight: 800; float: left; font-size: 3.1em; line-height: .82; padding: .04em .08em 0 0; }
@media screen and (max-width: 560px) { .lead-body { column-count: 1; } }
.box { break-inside: avoid; border: 1px solid var(--rule); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--rule); padding: .55rem .7rem; margin: .5rem 0 .3rem; text-align: left; background: var(--paper); }
.box h4 { font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; margin-bottom: .3rem; }
.box ol { padding-left: 1.1rem; font-size: .86rem; line-height: 1.35; }
.box li { margin-bottom: .3rem; }
.src { font-size: .64rem; color: var(--muted); margin: .3rem 0 .5rem; border-bottom: 1px solid var(--rule); padding-bottom: .5rem; }
.src a { text-decoration: none; border-bottom: 1px solid var(--hair); }

.secondary { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.sec { padding: 0 .9rem 0 0; font-size: .86rem; line-height: 1.36; text-align: justify; hyphens: auto; }
.sec + .sec { padding: 0 0 0 .9rem; border-left: 1px solid var(--hair); }
.sec h3 { font-family: var(--display); font-size: 1.12rem; line-height: 1.12; margin: .1rem 0 .3rem; text-align: left; }
.sec p { margin-bottom: .4rem; }
@media screen and (max-width: 560px) { .secondary { grid-template-columns: 1fr; } .sec + .sec { padding: .6rem 0 0; border-left: 0; border-top: 1px solid var(--hair); margin-top: .6rem; } .sec { padding-right: 0; } }

/* sidebar */
.side h5 { font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); padding: .22rem 0; margin: .8rem 0 .35rem; }
.side h5:first-child { margin-top: 0; }
.side table { width: 100%; border-collapse: collapse; font-size: .8rem; font-variant-numeric: tabular-nums; }
.mkt th { text-align: left; font-weight: 500; padding: .13rem 0; }
.mkt td { text-align: right; padding: .13rem 0 .13rem .4rem; font-weight: 600; }
.mkt tr { border-bottom: 1px dotted var(--hair); }
.mkt .chg { font-weight: 500; font-style: italic; min-width: 3.6rem; }
.mkt .up::before { content: '▲ '; font-size: .6em; vertical-align: .1em; }
.mkt .dn::before { content: '▼ '; font-size: .6em; vertical-align: .1em; }
.small { font-size: .68rem; color: var(--muted); margin-top: .25rem; line-height: 1.32; }
.wx-now b { font-family: var(--display); font-size: 1.7rem; font-weight: 800; }
.wx-now span { font-style: italic; font-size: .8rem; color: var(--ink2); margin-left: .3rem; }
.wx { margin-top: .4rem; }
.wx th { text-align: left; font-size: .64rem; letter-spacing: .1em; padding: .14rem 0; width: 2.4rem; }
.wx td:last-child { text-align: right; }
.wx tr { border-top: 1px solid var(--hair); }
.inside { list-style: none; font-size: .78rem; }
.inside li { display: grid; grid-template-columns: 2rem 1fr; gap: .3rem; padding: .32rem 0; border-top: 1px solid var(--hair); }
.inside li:first-child { border-top: 0; }
.inside b { font-size: .68rem; letter-spacing: .06em; }
.inside strong { display: block; font-weight: 600; line-height: 1.22; }
.inside span { color: var(--muted); font-size: .72rem; line-height: 1.25; display: block; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); margin-top: .8rem; }
.stat { padding: .45rem .9rem .5rem; }
.stat + .stat { border-left: 1px solid var(--rule); }
.stat b { display: block; font-family: var(--display); font-weight: 800; font-size: clamp(1.5rem, 4.6vw, 2.4rem); line-height: 1; letter-spacing: -.01em; }
.stat span { display: block; font-size: .68rem; color: var(--ink2); line-height: 1.28; margin-top: .22rem; }
@media screen and (max-width: 560px) { .stats { grid-template-columns: 1fr; } .stat + .stat { border-left: 0; border-top: 1px solid var(--rule); } }

.folio { display: flex; justify-content: space-between; margin-top: .55rem; padding-top: .3rem; border-top: 1px solid var(--rule);
	font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); }

/* ── back page ─────────────────────────────────────────────────────── */
.back-head { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; padding-bottom: .35rem; border-bottom: 3px double var(--rule);
	font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; }
.mini-flag { font-family: var(--black); font-size: 1.7rem; letter-spacing: 0; text-transform: none; line-height: 1; }
.puz-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: .2rem; margin-bottom: .5rem; }
.puz-head h3 { font-family: var(--display); font-size: 1.15rem; }
.puz-head span { font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.sudoku-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 1.1rem; }
.sudoku-row .sudoku + .sudoku { padding-left: 1.1rem; border-left: 1px solid var(--hair); }
@media screen and (max-width: 760px) { .sudoku-row { grid-template-columns: 1fr; } .sudoku-row .sudoku + .sudoku { padding-left: 0; border-left: 0; } }
.sudoku-row > .private { grid-column: 1 / -1; margin-top: .3rem; }
.sudoku { margin-bottom: .9rem; }

/* page 2: the whole daily brief, newspaper columns */
.brief-cols { column-count: 3; column-gap: 1.1rem; column-rule: 1px solid var(--hair); margin-top: .7rem; }
@media screen and (max-width: 900px) { .brief-cols { column-count: 2; } }
@media screen and (max-width: 560px) { .brief-cols { column-count: 1; } }
.bsec { margin-bottom: .7rem; }
.bsec h3 { break-after: avoid; font-family: var(--display); font-size: 1rem; font-weight: 800; letter-spacing: .01em; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); padding: .18rem 0; margin-bottom: .1rem; }
.bsec ul { list-style: none; }
.bsec li { break-inside: avoid; font-size: .84rem; line-height: 1.34; text-align: justify; hyphens: auto; padding: .38rem 0; border-top: 1px solid var(--hair); }
.bsec li:first-child { border-top: 0; }
.bsec li a { text-decoration: none; border-bottom: 1px solid var(--hair); font-size: .78em; font-style: italic; color: var(--ink2); }
.bsec li a:hover { border-color: var(--ink); }
.sudoku figcaption { display: flex; justify-content: space-between; align-items: baseline; font-size: .72rem; margin-bottom: .22rem; }
.sudoku figcaption span { font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sdgrid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); width: 100%; max-width: 19rem; margin: 0 auto; border: 2px solid var(--ink); }
.sd { position: relative; border: 1px solid var(--hair); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 0; font: 700 clamp(.75rem, 2.6vw, 1.1rem)/1 var(--display); }
.sd.c3 { border-right: 2px solid var(--ink); } .sd.r3 { border-bottom: 2px solid var(--ink); }
.sd.g { background: rgba(18,18,18,.06); }
.sd input { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; text-align: center; font: 500 clamp(.75rem, 2.4vw, 1rem)/1 var(--serif); color: #1f3a8a; outline: none; padding: 0; }
.sd input:focus { background: rgba(18,18,18,.1); }

.private { margin-top: 1rem; padding: .7rem .9rem .9rem; border: 1px solid var(--rule); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--rule); }
.unlock { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; font-size: .86rem; }
.unlock input[type=password] { font: inherit; padding: .25rem .5rem; border: 1px solid var(--rule); background: var(--paper); min-width: 12rem; }
.unlock button { font: inherit; padding: .25rem .9rem; border: 1px solid var(--rule); background: var(--ink); color: var(--paper); cursor: pointer; }
.unlock .rem { font-size: .76rem; color: var(--muted); display: flex; gap: .3rem; align-items: center; }
.err { width: 100%; color: #a11; font-size: .76rem; min-height: 1em; }
.priv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 0 1.2rem; }
@media screen and (max-width: 760px) { .priv-grid { grid-template-columns: 1fr; } }
.priv-col h4 { font-size: .66rem; letter-spacing: .13em; text-transform: uppercase; border-bottom: 1px solid var(--rule); padding-bottom: .2rem; margin-bottom: .35rem; }
.agenda, .radar { list-style: none; font-size: .82rem; line-height: 1.32; }
.agenda li { display: grid; grid-template-columns: 5.6rem 1fr; gap: .4rem; padding: .3rem 0; border-top: 1px solid var(--hair); }
.agenda li:first-child, .radar li:first-child { border-top: 0; }
.ev-when { font-size: .7rem; letter-spacing: .04em; }
.ev-when b { display: block; text-transform: uppercase; }
.ev-note { display: block; color: var(--muted); font-size: .72rem; }
.radar li { display: grid; grid-template-columns: 4.4rem 1fr; gap: .5rem; padding: .35rem 0; border-top: 1px solid var(--hair); }
.radar .tag { font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--ink); align-self: start; text-align: center; padding: .1rem .2rem; }
.radar .when { font-style: italic; color: var(--ink2); font-size: .74rem; margin-left: .25rem; }
.radar p { color: var(--ink2); font-size: .76rem; margin-top: .08rem; }
.radar a { text-decoration: none; border-bottom: 1px solid var(--hair); }
.priv-note { margin-top: .6rem; font-size: .74rem; font-style: italic; color: var(--ink2); }
.muted { color: var(--muted); font-size: .82rem; }

.key { margin-top: .7rem; font-size: .66rem; color: var(--muted); }
.key summary { cursor: pointer; letter-spacing: .1em; text-transform: uppercase; }
.key p { margin-top: .3rem; word-break: break-all; line-height: 1.35; }

/* ── archive list ──────────────────────────────────────────────────── */
.prevs { max-width: 62rem; margin: 0 auto 2rem; padding: 0 .4rem; font-size: .86rem; }
.prevs h2 { font-family: var(--display); font-size: 1rem; margin-bottom: .4rem; }
.prevs a { display: grid; grid-template-columns: 7.5rem 3.5rem 1fr; gap: .6rem; padding: .35rem 0; border-top: 1px solid var(--hair); text-decoration: none; }
.prevs a:hover span:last-child { text-decoration: underline; }
.prevs span:nth-child(-n+2) { color: var(--muted); font-size: .76rem; }

/* ── print: two A4 sheets, front and back ──────────────────────────── */
@page { size: A4; margin: 8mm; }
@media print {
	html, body { background: #fff; }
	.bar, .prevs, .key, .unlock { display: none !important; }
	.wrap { padding: 0; }
	html { font-size: 11.5px; }
	.sheet { box-shadow: none; max-width: none; margin: 0; padding: 0; background: #fff; height: 280mm; overflow: hidden;
		display: flex; flex-direction: column; page-break-after: always; break-after: page; }
	.sheet:last-of-type { page-break-after: auto; break-after: auto; }
	.cols, .brief-cols { flex: 1; min-height: 0; }
	.bsec li { font-size: 1.12rem; line-height: 1.36; padding: .5rem 0; }
	.bsec h3 { font-size: 1.3rem; }
	.folio { margin-top: auto; }
	.halftone { aspect-ratio: 16 / 6; }
	.sudoku-row { grid-template-columns: 1fr 1fr; gap: 1.2rem 1.2rem; align-content: start; }
	.sudoku-row .sudoku:nth-child(2) { padding-left: 1.2rem; border-left: 1px solid var(--hair); }
	.sudoku-row .sudoku:nth-child(3) { padding-left: 0; border-left: 0; }
	.sudoku-row > .private { grid-column: auto; margin-top: 0; align-self: start; }
	.priv-grid { grid-template-columns: 1fr; gap: .8rem; }
	.sdgrid { max-width: none; }
	.sudoku figcaption { font-size: 1rem; }
	.sd input { color: transparent; }
	.halftone img { filter: grayscale(1) contrast(1.4); }
}
</style>
</head>
<body>

<div class="bar">
	<a class="brand" href="/times/">The Utku Times</a>
	<nav>
		<a href="#a2">the brief ↓</a>
		<a href="#a-back">sudokus ↓</a>
		<button type="button" onclick="window.print()">print</button>
		<a href="/">the daily brief ↗</a>
	</nav>
</div>

<main class="wrap">
{{PAGE}}

	<section class="prevs">
		<h2>Previous editions</h2>
{{PREVIOUS}}
	</section>
</main>

<script>
/* ── sudoku: digits only, nothing is sent anywhere ─────────────────── */
(function () {
	document.querySelectorAll('.sd input').forEach(function (inp) {
		inp.addEventListener('input', function () { inp.value = inp.value.replace(/[^1-9]/g, '').slice(0, 1); });
	});
})();

/* ── unlock the sealed page: PBKDF2 → AES-256-CBC + HMAC-SHA256 ───── */
(function () {
	var form = document.getElementById('unlock');
	if (!form) return;
	var blob = JSON.parse(document.getElementById('sealed').textContent);
	var err = document.getElementById('pperr');
	var KEY = 'times-passphrase';
	var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };

	async function open(pass) {
		var enc = new TextEncoder();
		var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
		var raw = new Uint8Array(await crypto.subtle.deriveBits(
			{ name: 'PBKDF2', salt: b64(blob.salt), iterations: blob.iter, hash: 'SHA-256' }, base, 512));
		var iv = b64(blob.iv), ct = b64(blob.ct);
		var macKey = await crypto.subtle.importKey('raw', raw.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
		var msg = new Uint8Array(iv.length + ct.length); msg.set(iv); msg.set(ct, iv.length);
		if (!(await crypto.subtle.verify('HMAC', macKey, b64(blob.mac), msg))) throw new Error('bad');
		var aes = await crypto.subtle.importKey('raw', raw.slice(0, 32), 'AES-CBC', false, ['decrypt']);
		return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, aes, ct));
	}
	async function go(pass, remember) {
		err.textContent = '';
		try {
			var html = await open(pass);
			var body = document.getElementById('privbody');
			body.innerHTML = html; body.hidden = false; form.hidden = true;
			if (remember) { try { localStorage.setItem(KEY, pass); } catch (e) {} }
			return true;
		} catch (e) {
			err.textContent = 'that passphrase does not open this page.';
			return false;
		}
	}
	form.addEventListener('submit', function (e) {
		e.preventDefault();
		go(document.getElementById('pp').value, document.getElementById('remember').checked);
	});
	try {
		var saved = localStorage.getItem(KEY);
		if (saved) go(saved, false).then(function (ok) { if (!ok) { try { localStorage.removeItem(KEY); } catch (e) {} err.textContent = ''; } });
	} catch (e) {}
})();
</script>
</body>
</html>
